## config/delayed.yml
##
## Delayed-effect DGM (non-PH). Mirrors get_params_delayed.R.

seed: 2026

dgm:
  N: 2500
  N_truth: 500000
  admin_cens: 10

covariates:
  Lcovs_linear: 4
  Lcovs_sq:     2
  mu: [0, 0, 0, 0, 0, 0, 0, 0]
  rho_L: 0

exposure:
  alpha_L: [0.5, 0.4, -0.6, 0.4, 0.5, 0.3]
  alpha_W: 1

outcome:
  hazard_ratios:
    A:   0.5
    L:   [0.75, 2.0, 0.5, 0.8, 5.0, 1.5]
    Lsq: [0.95, 1.5]
    O:   0.8
    W:   1.5
  scaling:
    A:   1
    L:   0.3333333    # /3 scaling
    Lsq: 0.3333333
    O:   0.3333333
    W:   0.3333333
  weibull:
    gamma:  2
    lambda: 0.015

censoring:
  lambda_cens: 0.1

evaluation:
  t_eval: [1, 5, 10]
