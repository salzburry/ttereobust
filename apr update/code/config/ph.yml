## config/ph.yml
##
## Proportional hazards DGM. Mirrors the previous get_params_ph.R values.

seed: 2026

dgm:
  N: 2500
  N_truth: 500000
  admin_cens: 10

covariates:
  Lcovs_linear: 4
  Lcovs_sq:     2
  mu: [0, 0, 0, 0, 0, 0, 0, 0]
  rho_L: 0

exposure:
  alpha_L: [0.5, 0.4, -0.6, 0.4, 0.5, 0.3]
  alpha_W: 1

outcome:
  hazard_ratios:
    A:   0.5
    L:   [0.75, 2.0, 0.5, 0.8, 5.0, 1.5]
    Lsq: [0.95, 1.5]
    O:   0.8
    W:   1.5
  scaling:
    A:   1     # no down-scaling on A; protocol log-HR is log(0.5)
    L:   0.1   # PH scenario uses /10 scaling to keep risk heterogeneity small
    Lsq: 0.1
    O:   0.1
    W:   0.1
  weibull:
    gamma:  1
    lambda: 0.2

censoring:
  lambda_cens: 0.1

evaluation:
  t_eval: [1, 5, 10]
